<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>岳喜标｜个人作品集</title>
  <style>
    :root { --blue:#1677ff; --ink:#111827; --muted:#5f6b7a; --line:#dbe5f1; --pale:#f4f8ff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(145deg,#fff 0%,#f5f8fc 100%); color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
    main { width:min(100%,560px); padding:42px 34px 32px; background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 18px 60px rgba(23,52,92,.10); }
    .eyebrow { margin:0 0 14px; color:var(--blue); font-size:13px; font-weight:700; letter-spacing:.12em; }
    h1 { margin:0; font-size:30px; line-height:1.25; }
    .intro { margin:16px 0 30px; color:var(--muted); font-size:15px; line-height:1.8; }
    .actions { display:grid; gap:14px; }
    a { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:20px 22px; border-radius:14px; text-decoration:none; transition:.18s ease; }
    a strong { display:block; font-size:17px; }
    a span { display:block; margin-top:6px; font-size:12px; line-height:1.5; }
    .pdf { color:#fff; background:var(--blue); }
    .pdf span { color:rgba(255,255,255,.78); }
    .site { color:var(--ink); background:var(--pale); border:1px solid var(--line); }
    .site span { color:var(--muted); }
    a:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(22,119,255,.15); }
    .arrow { flex:none; font-size:22px; }
    footer { margin-top:26px; padding-top:20px; border-top:1px solid var(--line); color:#8a95a4; font-size:12px; text-align:center; }
    @media (max-width:480px) { main{padding:34px 22px 26px;border-radius:18px} h1{font-size:26px} }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PORTFOLIO · 2026</p>
    <h1>岳喜标的个人作品集</h1>
    <p class="intro">请选择适合你的浏览方式。手机端建议直接打开 PDF；电脑端可以进入个人网站查看完整互动展示。</p>
    <div class="actions">
      <a class="pdf" href="./pdf.html">
        <div><strong>直接打开 PDF 作品集</strong><span>适合微信与手机浏览 · 44 页</span></div><b class="arrow">↗</b>
      </a>
      <a class="site" href="./">
        <div><strong>进入个人作品集网站</strong><span>推荐使用电脑浏览器查看</span></div><b class="arrow">→</b>
      </a>
    </div>
    <footer>新媒体内容运营 × 视觉设计</footer>
  </main>
</body>
</html>
